[server]
host = "127.0.0.1"
port = 8765
log_level = "info"
keepalive_seconds = 1.0

[model]
backend = "mock"
path = "models/mock"
id = "local-coder-mock"
device = "CPU"
allow_cpu_fallback = false
max_prompt_tokens = 1024
min_response_tokens = 128
max_new_tokens = 256
temperature = 0.0
cache_dir = ".cache/mock"
prefill_hint = "DYNAMIC"
generate_hint = "FAST_COMPILE"

[agent]
prompt_char_budget = 3000
tool_schema_char_budget = 1200
max_history_items = 16
max_repair_attempts = 1
response_chunk_chars = 64

[security]
loopback_only = true
validate_host_header = true
max_request_bytes = 8388608
redact_request_bodies = true
